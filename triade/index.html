<script>

function attendre(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// SHA-256 synchrone compact pour le proof-of-work
const sha256pow = (function(){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
           0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
           0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
           0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
           0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
           0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
           0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
           0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const IV=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder();
  function r(x,n){return(x>>>n)|(x<<(32-n));}
  return function(s){
    const b=enc.encode(s),l=b.length,p=64*Math.ceil((l+9)/64);
    const d=new Uint8Array(p); d.set(b); d[l]=0x80;
    const v=new DataView(d.buffer); v.setUint32(p-4,l*8,false);
    const h=[...IV],w=new Uint32Array(64);
    for(let i=0;i<p;i+=64){
      for(let j=0;j<16;j++) w[j]=v.getUint32(i+j*4,false);
      for(let j=16;j<64;j++){
        const s0=r(w[j-15],7)^r(w[j-15],18)^(w[j-15]>>>3);
        const s1=r(w[j-2],17)^r(w[j-2],19)^(w[j-2]>>>10);
        w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
      }
      let a=h[0],b2=h[1],c=h[2],d2=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
      for(let j=0;j<64;j++){
        const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g);
        const t1=(hh+S1+ch+K[j]+w[j])|0;
        const S0=r(a,2)^r(a,13)^r(a,22), maj=(a&b2)^(a&c)^(b2&c);
        const t2=(S0+maj)|0;
        hh=g;g=f;f=e;e=(d2+t1)|0;d2=c;c=b2;b2=a;a=(t1+t2)|0;
      }
      h[0]=(h[0]+a)|0;h[1]=(h[1]+b2)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d2)|0;
      h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
    }
    return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
  };
})();

function solvePoW(challenge, difficulty) {
  const prefix = '0'.repeat(Math.floor(difficulty / 4));
  for (let n = 0; n < 10000000; n++) {
    if (sha256pow(challenge + ':' + n).startsWith(prefix)) return n;
  }
  return -1;
}

function showPowError(msg) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #c62828;border-radius:10px;padding:28px 36px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;z-index:99999;box-shadow:0 4px 24px rgba(0,0,0,0.18)';
  d.innerHTML = '<p style="color:#c62828;font-size:15px;font-weight:700;margin:0 0 8px">' + msg + '</p>'
    + '<p style="color:#555;font-size:13px;margin:0 0 18px">Veuillez rafraîcher la page pour réessayer.</p>'
    + '<button onclick="location.reload()" style="background:#080A66;color:#fff;border:none;border-radius:6px;padding:8px 22px;font-size:13px;font-weight:600;cursor:pointer">↻ Rafraîcher</button>';
  document.body.appendChild(d);
}

async function ouvert() {
  const timer = attendre(4000);
  try {
    const resp = await fetch('pow_challenge.php');
    if (!resp.ok) { showPowError('Impossible de contacter le serveur.'); return; }
    const { challenge, signature, difficulty } = await resp.json();
    const counter = solvePoW(challenge, difficulty);
    if (counter < 0) { showPowError('Vérification CAPTCHA échouée.'); return; }
    document.cookie = 'triade_pow=' + challenge + ':' + signature + ':' + counter
      + '; path=/; max-age=60; SameSite=Strict';
    await timer;
    document.cookie = 'triade_from_index=1; path=/; max-age=30; SameSite=Strict';
    location.href = 'index1.php';
  } catch(e) {
    showPowError('Erreur de connexion au serveur.');
  }
}

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags ⿿ manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin ⿿ blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec ⿿ re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nd: var(--bg);\n    height: 100%;\n    overflow: hidden;\n    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;\n  }\n\n  .stage {\n    width: 100vw;\n    height: 100vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 28px;\n  }\n\n  /* ⿿⿿ Badge ⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿ */\n  .badge {\n    width: 140px;\n    height: 140px;\n    background: var(--navy);\n    border-radius: 25.2px;\n    position: relative;\n    overflow: hidden;\n    flex-shrink: 0;\n    opacity: 0;\n    animation: cycle-badge calc(4s / var(--speed)) ease-in-out infinite;\n  }\n\n  /* ⿿⿿ Triforce sub-triangles ⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿ */\n  .tri-svg {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n  }\n  .tri-group {\n    transform-origin: center;\n    animation: cycle-pulse calc(4s / var(--speed)) ease-in-out infinite;\n  }\n  .tri-top, .tri-left, .tri-right { fill: var(--lavender); }\n  .tri-top   { animation: cycle-top   calc(4s / var(--speed)) cubic-bezier(.2,.7,.2,1) infinite; }\n  .tri-left  { animation: cycle-left  calc(4s / var(--speed)) cubic-bezier(.2,.7,.2,1) infinite; }\n  .tri-right { animation: cycle-right calc(4s / var(--speed)) cubic-bezier(.2,.7,.2,1) infinite; }\n  .tri-merge { fill: var(--lavender); opacity: 0; animation: cycle-merge calc(4s / var(--speed)) ease-in-out infinite; }\n\n  /* ⿿⿿ Wordmark ⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿⿿ */\n  .word {\n    display: flex;\n    align-items: baseline;\n  }\n  .word span {\n    font-family: 'Archivo', sans-serif;\n    font-weight: 800;\n    font-size: 72px;\n    color: var(--navy);\n    letter-spacing: -0.025em;\n    display: inline-block;\n    opacity: 0;\n    animation: cycle-letter calc(4s / var(--speed)) cubic-bezier(.2,.8,.2,1) infinite;\n  }\n\n  /* ⿿⿿ Keyframes (one 4s cycle, with hold at end before restart) ⿿⿿⿿⿿⿿⿿⿿\n     Animation phases on 0-100% of the 4s cycle:\n       0-9% eX(0); }\n  }\n\n  /* Per-letter stagger (10 letters of CHARGEMENT) */\n  .word span:nth-child(1)  { animation-delay: calc(0s); }\n  .word span:nth-child(2)  { animation-delay: calc(0.045s / var(--speed)); }\n  .word span:nth-child(3)  { animation-delay: calc(0.090s / var(--speed)); }\n  .word span:nth-child(4)  { animation-delay: calc(0.135s / var(--speed)); }\n  .word span:nth-child(5)  { animation-delay: calc(0.180s / var(--speed)); }\n  .word span:nth-child(6)  { animation-delay: calc(0.225s / var(--speed)); }\n  .word span:nth-child(7)  { animation-delay: calc(0.270s / var(--speed)); }\n  .word span:nth-child(8)  { animation-delay: calc(0.315s / var(--speed)); }\n  .word span:nth-child(9)  { animation-delay: calc(0.360s / var(--speed)); }\n  .word span:nth-child(10) { animation-delay: calc(0.405s / var(--speed)); }\n<\u002Fstyle>\n<\u002Fhead>\n<body background=\"#EEEEEE\" >\n  <div class=\"stage\">\n    <div class=\"badge\">\n      <svg class=\"tri-svg\" viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\">\n        <g class=\"tri-group\">\n          <!--\n            Triforce geometry: outer equilateral-ish triangle at scale 0.70, nudge 0.04.\n            Sub-triangles formed by joining midpoints.\n            Outer triangle apex(70, 27.55), bl(21, 90.45), br(119, 90.45)\n            Midpoints: top=(45.5, 59), right=(94.5, 59), bottom=(70, 90.45)\n          -->\n          <path class=\"tri-top\" d=\"M 70 27.55 L 94.5 59 L 45.5 59 Z\"><\u002Fpath>\n          <path class=\"tri-left\" d=\"M 45.5 59 L 70 90.45 L 21 90.45 Z\"><\u002Fpath>\n          <path class=\"tri-right\" d=\"M 94.5 59 L 119 90.45 L 70 90.45 Z\"><\u002Fpath>\n          <!-- Merge layer: full filled triangle that takes over -->\n          <path class=\"tri-merge\" d=\"M 70 27.55 L 119 90.45 L 21 90.45 Z\"><\u002Fpath>\n        <\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"word\">\n      <span>C<\u002Fspan><span>H<\u002Fspan><span>A<\u002Fspan><span>R<\u002Fspan><span>G<\u002Fspan><span>E<\u002Fspan><span>M<\u002Fspan><span>E<\u002Fspan><span>N<\u002Fspan><span>T<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
